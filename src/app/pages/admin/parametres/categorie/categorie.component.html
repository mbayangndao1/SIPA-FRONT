<p-toast></p-toast>
<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="left">
                    <div class="my-2">
                        <button pButton pRipple label="ajouter" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
                    </div>
                </ng-template>
                <ng-template pTemplate="right" *ngIf="categories && categories.length > 0">
                   <!-- <button pButton pRipple label="télécharger" icon="pi pi-upload" class="p-button-help" (click)="dt.exportCSV()"></button>-->
                    <button pButton type="button" icon="pi pi-file-pdf" class="p-button-warning mr-2"
                            (click)="generatePDF()"></button>
                    <button pButton type="button" icon="pi pi-file-excel" class="p-button-success mr-2"
                            (click)="exporterEnExcel()"></button>
                </ng-template>
            </p-toolbar>

            <p-table *ngIf="categories && categories.length > 0" #dt [value]="categories" [columns]="cols" responsiveLayout="scroll" [rows]="10" [globalFilterFields]="['libelle','description','active']" [paginator]="true" [rowsPerPageOptions]="[10,20,30]" [showCurrentPageReport]="true" currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} entrées"  selectionMode="multiple" [rowHover]="true" dataKey="id">
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Gestion des categories</h5>
                        <span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Rechercher..."  class="w-full sm:w-auto"/>
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="libelle">Libelle <p-sortIcon field="libelle"></p-sortIcon></th>
                        <th pSortableColumn="description">Description<p-sortIcon field="description"></p-sortIcon></th>
                        <th pSortableColumn="active">Etat du thème<p-sortIcon field="active"></p-sortIcon></th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-categorie>
                    <tr>
                        <td style=" min-width:10rem;"><span class="p-column-title">Code</span>
                            {{categorie?.libelle}}
                        </td>
                        <td style=" min-width:10rem;"><span class="p-column-title">Code</span>
                            {{categorie?.description}}
                        </td>
                        <td style=" min-width:10rem;"><span class="p-column-title">Code</span>
                            {{categorie?.active}}
                        </td>
                        <td>
                            <div class="flex">
                                <button pButton pRipple  icon="pi pi-pencil" class=" p-button p-component p-button-text p-button-icon-only p-button-success mr-2"  (click)="editCategorie(categorie)"><span class="p-button-icon pi pi-pencil" aria-hidden="true"></span></button>
                                <button pButton pRipple  icon="pi pi-trash" class=" p-button p-component p-button-text p-button-icon-only p-button-danger"  (click)="deleteCategorie(categorie)"><span class="p-button-icon pi pi-trash" aria-hidden="true"></span></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            <div *ngIf="categories?.length===0">Aucun thème </div>
        </div>

        <p-dialog [(visible)]="categorieDialog" [style]="{width: '450px'}" header="Details du thème" [modal]="true" class="p-fluid">
            <ng-template pTemplate="content">
                <form [formGroup]="form" (ngSubmit)="createCategorie()">
                    <div class="field">
                        <label for="libelle">Libelle</label>
                        <input type="text" pInputText id="libelle" formControlName="libelle"/>
                    </div>
                    <div class="field">
                        <label for="description">Description</label>
                        <textarea type="text" pInputText id="description" formControlName="description"> </textarea>
                    </div>
                    <div class="field">
                        <label for="active">activer</label><br>
                        <p-inputSwitch id="active"  formControlName="active"></p-inputSwitch>
                    </div>
                </form>
            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Annuler" icon="pi pi-times" class="p-button-text p-button-danger" (click)="hideDialog()"></button>
                <button pButton pRipple label="Sauvegarder" icon="pi pi-check" class="p-button-text p-button-success" (click)="createCategorie()" [disabled]="form.invalid" [loading]="loadingCategorie"></button>
            </ng-template>
        </p-dialog>

        <p-dialog [(visible)]="deleteCategorieDialog" header="Confirmer" [modal]="true" [style]="{width:'450px'}">
            <div class="flex align-items-center justify-content-center">
                <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
                <span *ngIf="categorie">Voulez-vous supprimer <b>{{categorie.libelle}}</b>?</span>
            </div>
            <ng-template pTemplate="footer">
                <button pButton pRipple icon="pi pi-times" class="p-button-text" label="non" (click)="deleteCategorieDialog = false"></button>
                <button pButton pRipple icon="pi pi-check" class="p-button-text" label="oui" (click)="confirmDelete()" [loading]="loadingCategorie"></button>
            </ng-template>
        </p-dialog>
    </div>
</div>
<div *ngIf="loadingCategorie" class="loading-message text text-center">
    <p>Chargement, veuillez patienter...</p>
</div>
